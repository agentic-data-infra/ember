[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ember"
version = "0.1.0"
description = "Ember's Dataframe API for Python"
requires-python = "==3.10.*"
dependencies = ["pyarrow"]

[tool.setuptools]
packages = ["ember"]

[tool.setuptools.package-data]
ember = ["_ember.so"]
